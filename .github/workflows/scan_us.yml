name: ZigZag KB Scan (US)
# Separate from the Indian scan.yml — runs the US scanner and commits only the
# US feeds (results_us.json / performance_us.json). The Indian workflow is
# untouched and runs in a non-overlapping window.
on:
  workflow_dispatch:
  schedule:
    # Phase 1 (free tier, EOD): one post-close run on US trading days.
    # 22:30 UTC = 6:30 PM EDT / 5:30 PM EST — after the 4 PM ET close.
    - cron: "30 22 * * 1-5"
    # Phase 2 (Starter tier, live intraday): swap in a 5-min market-hours cron,
    # e.g.  "*/5 13-21 * * 1-5"  (covers 9:30 AM–4:00 PM ET across EDT/EST).
permissions:
  contents: write
jobs:
  scan-us:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Persist the daily-history cache between runs so we don't re-backfill.
      - name: restore daily cache
        uses: actions/cache@v4
        with:
          path: us_cache
          key: us-cache-${{ github.run_id }}
          restore-keys: |
            us-cache-
      - run: pip install -q requests pandas numpy pyarrow
      - name: run US scan
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          US_N_SYMBOLS: "1000"
          US_BACKFILL_DAYS: "730"
          US_DEVIATION: "15.0"    # tuned for US — see US_STOCKS_PLAN.md (Indian uses 35)
        run: python run_scan_us.py
      - name: publish US JSON feeds
        run: |
          git config user.name "zigzag-kb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results_us.json performance_us.json
          git commit -m "update US results $(date -u +%H:%M)" || echo "no change"
          git push
