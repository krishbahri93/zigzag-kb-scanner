name: ZigZag KB Scan
on:
  workflow_dispatch:                 # lets you run it manually too
  schedule:
    - cron: "*/5 3-10 * * 1-5"       # every 5 min, ~NSE hours (UTC, Mon-Fri); GitHub timing is best-effort
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy requests dhanhq
      - name: run scan
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          KWM_DATA_SOURCE: dhan
        run: python run_scan.py
      - name: publish results.json
        run: |
          git config user.name "zigzag-kb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.json
          git commit -m "update results $(date -u +%H:%M)" || echo "no change"
          git push

