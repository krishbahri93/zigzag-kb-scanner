name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        run: pip install -e ".[dev]"
      - name: Unit tests + 24-symbol parity gate
        run: python -m pytest tests/ -q
