{% extends "base.html" %}
{% block content %}
<div class="meta" id="meta">Loading scan …</div>

<div class="cards" id="cards"></div>

<div class="toolbar">
  <span class="swingchips" id="chips"></span>
  <select id="fSector"><option value="">All sectors</option></select>
  <input type="text" id="fQ" placeholder="Search symbol…">
  <button class="btn" id="bVol">⚡ Vol spikes</button>
  <button class="btn" id="bCopy">⎘ Copy for TradingView</button>
  <button class="btn" id="bTxt">⬇ Download TXT</button>
</div>

<div class="tbl-wrap"><table class="trades">
  <thead><tr id="head"></tr></thead>
  <tbody id="body"></tbody>
</table></div>
<div class="mcards" id="mcards"></div>

<p class="foot">Scanner shows setups to act on <b>today</b>: In Zone + Triggered (tap the
Approaching card to reveal early setups). Trades entered on earlier days live in the
<a href="/active?market={{ market }}">Active</a> tab. Informational only — not financial advice.</p>

<script>
(function () {
  const K = window.KWM, $ = id => document.getElementById(id);
  const COLS = [
    { k: "sym",          t: "Symbol"      },
    { k: "sig",          t: "Signal"      },
    { k: "_fresh",       t: "•"           },
    { k: "ltp",          t: "CMP"         },
    { k: "day_pct",      t: "Day %"       },
    { k: "_entry",       t: "Entry"       },
    { k: "_sl",          t: "Stop"        },
    { k: "vol_x",        t: "Vol ×"       },
    { k: "rr",           t: "R:R"         },
    { k: "dist_pct",     t: "To entry %"  },
    { k: "confirmed_at", t: "Confirmed"   },
  ];
  let trades = [], sortK = "rr", sortDir = -1, expanded = null, allRows = [];
  const F = { sector: "", swing: "", q: "", vol: false, showAppr: false, sig: "" };

  // "Entry" = the trigger price (band top, 0.382): the level whose daily-close crossing fires
  const val = (t, k) => k === "_entry" ? t.entry_hi
            : k === "_sl" ? t.sl : k === "_fresh" ? (t.fresh ? 1 : 0) : t[k];

  function visible() {
    return trades.filter(t => t.sig !== "Active")
      .filter(t => F.showAppr || t.sig !== "Approaching")
      .filter(t =>
        (!F.sig || t.sig === F.sig) &&
        (!F.swing || t.swing === F.swing) &&
        (!F.sector || t.sector === F.sector) &&
        (!F.q || t.sym.toUpperCase().includes(F.q.toUpperCase())) &&
        (!F.vol || (t.vol_x !== null && t.vol_x >= 2)));
  }

  function badge(t) {
    const cls = t.sig === "Triggered" ? "b-trig" : t.sig === "In Zone" ? "b-zone" : "b-appr";
    return `<span class="tn">${t.swing}</span><span class="badge ${cls}">${t.sig}</span>`;
  }

  function render() {
    const rs = visible().slice().sort((a, b) => {
      const x = val(a, sortK), y = val(b, sortK);
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir;
    });

    // cards (counts over the whole non-Active pool, not the current filter)
    const pool = trades.filter(t => t.sig !== "Active");
    const C = [
      ["All",          pool.length,                                      "ALL",         ""      ],
      ["In Zone",      pool.filter(t => t.sig === "In Zone").length,     "In Zone",     "v-zone"],
      ["Triggered",    pool.filter(t => t.sig === "Triggered").length,   "Triggered",   "v-trig"],
      ["Approaching",  pool.filter(t => t.sig === "Approaching").length, "APPR",        "v-appr"],
      ["⚡ Vol spikes", pool.filter(t => t.sig !== "Approaching" && t.vol_x !== null && t.vol_x >= 2).length, "VOL", "v-vol"],
      ["Fresh",        pool.filter(t => t.fresh).length,                 "",            "v-fresh"],
    ];
    $("cards").innerHTML = C.map(c => {
      const on = c[2] === "VOL" ? F.vol : c[2] === "APPR" ? F.showAppr : (c[2] && c[2] === F.sig);
      return `<div class="kcard ${c[3]} ${on ? "on" : ""}" data-f="${c[2]}">
        <div class="lbl">${c[0]}</div><div class="val">${c[1]}</div></div>`;
    }).join("");
    document.querySelectorAll(".kcard").forEach(el => el.onclick = () => {
      const f = el.dataset.f;
      if (f === "ALL") {          // full reset: clear every filter and reveal Approaching too
        F.sig = ""; F.vol = false; F.showAppr = true; F.swing = ""; F.sector = ""; F.q = "";
        $("fSector").value = ""; $("fQ").value = ""; $("bVol").classList.remove("on");
      }
      else if (f === "VOL") F.vol = !F.vol;
      else if (f === "APPR") { F.showAppr = !F.showAppr; F.sig = F.showAppr ? "Approaching" : ""; }
      else if (f) { F.sig = (F.sig === f) ? "" : f; if (F.sig !== "Approaching") F.showAppr = false; }
      render();
    });

    // swing chips
    $("chips").innerHTML = ["", "T1", "T2", "T3", "T4"].map(s =>
      `<span class="chip ${F.swing === s ? "on" : ""}" data-s="${s}">${s || "All"}</span>`).join("");
    document.querySelectorAll("#chips .chip").forEach(el => el.onclick = () => {
      F.swing = el.dataset.s; render();
    });

    // table header
    $("head").innerHTML = COLS.map(c =>
      `<th data-k="${c.k}">${c.t} ${sortK === c.k ? `<span class="arr">${sortDir < 0 ? "▼" : "▲"}</span>` : ""}</th>`
    ).join("");
    document.querySelectorAll("#head th[data-k]").forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (sortK === k) sortDir = -sortDir; else { sortK = k; sortDir = -1; }
      render();
    });

    const key = t => t.sym + ":" + t.swing;

    // desktop table
    $("body").innerHTML = rs.map((t, i) => {
      const dp = t.day_pct;
      return `<tr class="datarow" data-i="${i}">
        <td><a class="sym" target="_blank" rel="noopener" href="${K.tv(t.sym)}">${t.sym}</a></td>
        <td style="text-align:left">${badge(t)}</td>
        <td style="width:18px;text-align:center">${t.fresh ? '<span class="freshdot" title="Fresh — new this scan"></span>' : ""}</td>
        <td>${K.nf(t.ltp)}</td>
        <td class="${dp > 0 ? "pos" : dp < 0 ? "neg" : ""}">${(dp === null || dp === undefined) ? "—" : (dp > 0 ? "+" : "") + K.nf(dp) + "%"}</td>
        <td>${K.nf(t.entry_hi)}</td>
        <td>${K.nf(t.sl)}</td>
        <td>${(t.vol_x === null || t.vol_x === undefined) ? "—" : (t.vol_x >= 2 ? `<span class="volx">⚡ ${K.nf(t.vol_x, 1)}×</span>` : K.nf(t.vol_x, 1) + "×")}</td>
        <td>${K.nf(t.rr)}</td>
        <td>${(t.dist_pct === null || t.dist_pct === undefined) ? "—" : K.nf(t.dist_pct) + "%"}</td>
        <td class="muted">${K.rel(t.confirmed_at)}</td>
      </tr>` + (expanded === key(t) ? detailRow(t) : "");
    }).join("") || `<tr><td colspan="11" class="muted" style="padding:24px;text-align:center">No setups match the current filters.</td></tr>`;

    document.querySelectorAll("tr.datarow").forEach(tr => tr.onclick = e => {
      if (e.target.closest("a")) return;
      const t = rs[Number(tr.dataset.i)];
      expanded = (expanded === key(t)) ? null : key(t);
      render();
    });

    // phone cards
    $("mcards").innerHTML = rs.map((t, i) => {
      const dp = t.day_pct;
      return `<div class="mcard" data-i="${i}">
        <div class="r1">
          <a class="sym" target="_blank" rel="noopener" href="${K.tv(t.sym)}">${t.sym}</a>
          ${badge(t)} ${t.fresh ? '<span class="freshdot"></span>' : ""}
          <span class="right num"><b>${K.nf(t.ltp)}</b><br>
            <span class="${dp > 0 ? "pos" : dp < 0 ? "neg" : "muted"}" style="font-size:12px">
              ${(dp === null || dp === undefined) ? "—" : (dp > 0 ? "+" : "") + K.nf(dp) + "%"}</span></span>
        </div>
        <div class="r2">
          <span>Entry <b>${K.nf(t.entry_hi)}</b></span>
          <span>Stop <b>${K.nf(t.sl)}</b></span>
          <span>R:R <b>${K.nf(t.rr)}</b></span>
          <span>${(t.vol_x !== null && t.vol_x >= 2) ? `<span class="volx">⚡ ${K.nf(t.vol_x, 1)}×</span>` : "Vol " + (t.vol_x == null ? "—" : K.nf(t.vol_x, 1) + "×")}</span>
        </div>
        ${expanded === key(t) ? `<div class="more r2">
          <span>Entry band <b>${K.band(t.entry_lo, t.entry_hi)}</b></span>
          <span>Target <b>${K.band(t.tp_lo, t.tp_hi)}</b></span>
          <span>To entry <b>${t.dist_pct == null ? "—" : K.nf(t.dist_pct) + "%"}</b></span>
          <span>Depth <b>${K.nf(t.depth_pct, 1)}%</b></span>
          <span>${t.sector || ""}</span>
          <span class="muted">${K.rel(t.confirmed_at)}</span></div>` : ""}
      </div>`;
    }).join("") || `<div class="muted" style="padding:20px;text-align:center">No setups match the current filters.</div>`;
    document.querySelectorAll(".mcard").forEach(el => el.onclick = e => {
      if (e.target.closest("a")) return;
      const t = rs[Number(el.dataset.i)];
      expanded = (expanded === key(t)) ? null : key(t);
      render();
    });

    window._syms = [...new Set(rs.map(t => t.sym))];
  }

  function detailRow(t) {
    return `<tr class="detail"><td colspan="11">
      <div class="swings">
        <div class="swingbox"><b>${t.swing}</b> · depth ${K.nf(t.depth_pct, 1)}% · peak A ${K.nf(t.A)}<br>
          Entry ${K.band(t.entry_lo, t.entry_hi)} · Target ${K.band(t.tp_lo, t.tp_hi)} · Stop ${K.nf(t.sl)}</div>
        <div class="swingbox">Sector: <b>${t.sector || "—"}</b><br>
          B (common low) ${K.nf(t.B)} · data as of ${t.asof}</div>
      </div></td></tr>`;
  }

  $("fSector").onchange = e => { F.sector = e.target.value; render(); };
  $("fQ").oninput = e => { F.q = e.target.value; render(); };
  $("bVol").onclick = () => { F.vol = !F.vol; $("bVol").classList.toggle("on", F.vol); render(); };
  K.copyButtons(() => window._syms || [], $("bCopy"), $("bTxt"));

  async function load() {
    let res;
    try { res = await K.fetchScan(); }
    catch (e) { $("meta").textContent = "Could not load the scan — check the connection and refresh."; return; }
    if (!res.scan) { $("meta").textContent = "No scan yet — press Refresh to run the first one."; return; }
    allRows = res.scan.rows || [];
    trades = K.flatten(res.scan);
    const todays = trades.filter(t => t.sig === "In Zone" || t.sig === "Triggered").length;
    const nAct = trades.filter(t => t.sig === "Active").length;
    $("meta").innerHTML = `Data as of ${res.scan.data_asof} · scanned ${res.scan.scanned_ok} of ` +
      `${res.scan.universe_size} symbols · <b>${todays}</b> to act on today · ` +
      `<a href="/active?market=${K.MARKET}">${nAct} active trades →</a>`;
    const sectors = [...new Set(trades.filter(t => t.sig !== "Active").map(t => t.sector).filter(Boolean))].sort();
    $("fSector").innerHTML = '<option value="">All sectors</option>' +
      sectors.map(s => `<option${s === F.sector ? " selected" : ""}>${s}</option>`).join("");
    render();
  }
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
{% endblock %}
